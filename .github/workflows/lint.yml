name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPCS (WordPress Coding Standards)
        run: composer run lint

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPUnit
        run: composer run test

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WP-11 / requirements §7 A-1: Plugin Check(PCP)の Security と
      # Plugin repo カテゴリが両方0件であることが新規申請の必須要件
      # (2024-10-01施行)。ローカルにPHP/WordPress環境が無いため、公式の
      # wordpress/plugin-check-action(内部でwp-envを起動しPCPを実行)を使う。
      # tests/やdev用の設定ファイルはこのリポジトリには入っているが
      # wordpress.org配布物には含めない(.distignore参照)ため、PCPの
      # 対象からも同様に除外する。
      #
      # ★slugを明示指定する★ 指定しないとアクションがgitリポジトリの
      # ディレクトリ名(r2c-wordpress-plugin)をスラッグとして扱ってしまい、
      # 実際に確定しているスラッグ(r2c-ai-concierge、メインファイルの
      # Text Domainと一致)との不一致でTextDomainMismatch/trademarked_term
      # (slugに"plugin"を含む)が大量に誤検出される(初回実行で確認済み)。
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          slug: 'r2c-ai-concierge'
          categories: 'security,plugin_repo'
          exclude-directories: 'tests,.github,.git'
          exclude-files: 'CLAUDE.md,composer.json,composer.lock,phpcs.xml.dist,phpunit.xml.dist,.distignore,.gitignore'
