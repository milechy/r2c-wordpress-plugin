name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPCS (WordPress Coding Standards)
        run: composer run lint

      # WP-UX-19: 翻訳の抜けを CI で止める。ソースに新しい文字列を足したのに
      # .pot / ja.po / .mo を更新し忘れると、日本語の画面に英語が混ざる
      # (WP-UX-19 の調査で16件の抜けが見つかった)。
      #
      # 翻訳を更新するとき(ローカルで同じコマンドを実行する。要 gettext):
      #   1. このステップの xgettext を実行して languages/r2c-ai-concierge.pot を作り直す
      #      (ヘッダは既存のものを残す)
      #   2. msgmerge --no-wrap --no-fuzzy-matching --add-location=file -U languages/ja.po languages/r2c-ai-concierge.pot
      #   3. ja.po の空の msgstr を訳す
      #   4. msgfmt --check -o languages/r2c-ai-concierge-ja.mo languages/ja.po
      # .mo はバイナリなので手でマージしない。ja.po から毎回作り直す。
      - name: Check translations are complete and in sync
        run: |
          set -eu
          command -v xgettext >/dev/null || sudo apt-get install -y gettext
          xgettext --language=PHP --from-code=UTF-8 \
            -k -k__ -k_e -kesc_html__ -kesc_attr__ -kesc_html_e -kesc_attr_e \
            -k_x:1,2c -kesc_html_x:1,2c -kesc_attr_x:1,2c -k_n:1,2 \
            --add-comments=translators -o /tmp/source.pot \
            r2c-ai-concierge.php includes/*.php
          ids() { msgattrib --no-obsolete --no-wrap "$1" | grep -E '^msgid(_plural)? ' | sort; }
          status=0
          if ! diff <(ids /tmp/source.pot) <(ids languages/r2c-ai-concierge.pot); then
            echo "::error file=languages/r2c-ai-concierge.pot::.pot is out of date with the source (see the '<' / '>' lines above: < = in source only, > = in .pot only). Regenerate it."
            status=1
          fi
          if ! msgcmp languages/ja.po languages/r2c-ai-concierge.pot; then
            echo "::error file=languages/ja.po::ja.po is missing (or has an empty translation for) strings that are in the .pot."
            status=1
          fi
          if [ -n "$(msgattrib --untranslated --fuzzy --no-obsolete languages/ja.po | grep '^msgid ' || true)" ]; then
            echo "::error file=languages/ja.po::ja.po has untranslated or fuzzy entries."
            msgattrib --untranslated --fuzzy --no-obsolete --no-wrap languages/ja.po | grep '^msgid ' || true
            status=1
          fi
          msgfmt --check -o /tmp/ja.mo languages/ja.po
          if ! diff <(msgunfmt /tmp/ja.mo) <(msgunfmt languages/r2c-ai-concierge-ja.mo) >/dev/null; then
            echo "::error file=languages/r2c-ai-concierge-ja.mo::.mo does not match ja.po. Rebuild it with: msgfmt -o languages/r2c-ai-concierge-ja.mo languages/ja.po"
            status=1
          fi
          exit $status

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPUnit
        run: composer run test

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WP-11 / requirements §7 A-1: Plugin Check(PCP)の Security と
      # Plugin repo カテゴリが両方0件であることが新規申請の必須要件
      # (2024-10-01施行)。ローカルにPHP/WordPress環境が無いため、公式の
      # wordpress/plugin-check-action(内部でwp-envを起動しPCPを実行)を使う。
      #
      # ★生のgit checkoutではなく.distignoreで濾したビルド成果物に対して
      # 実行する★ exclude-directories/exclude-filesオプションは個別checkの
      # ファイル走査は除外できるが、hidden_filesチェック(隠しファイルの
      # 存在そのものを見る)はこれらのオプションを無視することを2回の
      # 実機実行で確認した。本番のSVN/zip配布物には最初から.git等が
      # 存在しないのと同じ状態を作るため、rsyncで.distignore記載分を
      # 除いたコピーを作り、そちらをbuild-dirに指定する。
      - name: Build clean plugin directory (.distignore-filtered)
        run: |
          mkdir -p /tmp/plugin-build/r2c-ai-concierge
          rsync -a --exclude-from='.distignore' ./ /tmp/plugin-build/r2c-ai-concierge/

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: '/tmp/plugin-build/r2c-ai-concierge'
          categories: 'security,plugin_repo'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # tests-e2e/README.md: wp-envで実WordPressを起動し、
      # tests-e2e/mu-plugins/r2c-mock-api.php がapi.r2c.bizの代わりを
      # 務める(commerce-faq-tasks側は一切関与しない)。プラグイン単体の
      # 挙動だけを対象にする。
      - name: Start wp-env and activate the plugin
        run: npm run e2e:start

      - name: Run Playwright E2E tests
        run: npm run e2e

      # 失敗の切り分け用: WP側PHPのエラーログとモックの状態をCIログへ
      # そのまま出す(アーティファクトDLの往復を待たずに済む)。
      - name: Dump WP debug log and mock state
        if: always()
        run: |
          echo "::group::wp-content/debug.log"
          npx wp-env run cli bash -c "cat wp-content/debug.log 2>/dev/null || echo '(no debug.log)'"
          echo "::endgroup::"
          echo "::group::r2c_mock_state option"
          npx wp-env run cli wp option get r2c_mock_state --format=json || true
          echo "::endgroup::"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
