name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPCS (WordPress Coding Standards)
        run: composer run lint

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPUnit
        run: composer run test

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WP-11 / requirements §7 A-1: Plugin Check(PCP)の Security と
      # Plugin repo カテゴリが両方0件であることが新規申請の必須要件
      # (2024-10-01施行)。ローカルにPHP/WordPress環境が無いため、公式の
      # wordpress/plugin-check-action(内部でwp-envを起動しPCPを実行)を使う。
      #
      # ★生のgit checkoutではなく.distignoreで濾したビルド成果物に対して
      # 実行する★ exclude-directories/exclude-filesオプションは個別checkの
      # ファイル走査は除外できるが、hidden_filesチェック(隠しファイルの
      # 存在そのものを見る)はこれらのオプションを無視することを2回の
      # 実機実行で確認した。本番のSVN/zip配布物には最初から.git等が
      # 存在しないのと同じ状態を作るため、rsyncで.distignore記載分を
      # 除いたコピーを作り、そちらをbuild-dirに指定する。
      - name: Build clean plugin directory (.distignore-filtered)
        run: |
          mkdir -p /tmp/plugin-build/r2c-ai-concierge
          rsync -a --exclude-from='.distignore' ./ /tmp/plugin-build/r2c-ai-concierge/

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: '/tmp/plugin-build/r2c-ai-concierge'
          categories: 'security,plugin_repo'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # tests-e2e/README.md: wp-envで実WordPressを起動し、
      # tests-e2e/mu-plugins/r2c-mock-api.php がapi.r2c.bizの代わりを
      # 務める(commerce-faq-tasks側は一切関与しない)。プラグイン単体の
      # 挙動だけを対象にする。
      - name: Start wp-env and activate the plugin
        run: npm run e2e:start

      # Playwright越しではなく、CIランナーから直接モックAPIを叩いて
      # ルート自体が生きているか切り分ける(失敗の原因がモック側か
      # ブラウザ/JS側かをここで確定させる)。
      - name: Sanity-check the mock API directly
        run: |
          set -x
          echo "--- rest_route index (is r2c-mock namespace registered at all?) ---"
          curl -s http://localhost:8888/wp-json/ | head -c 4000
          echo
          echo "--- reset ---"
          curl -s -w '\nHTTP_STATUS:%{http_code}\n' -X POST http://localhost:8888/wp-json/r2c-mock/v1/__test__/reset
          echo "--- configure (seed_api_key) ---"
          curl -s -w '\nHTTP_STATUS:%{http_code}\n' -X POST http://localhost:8888/wp-json/r2c-mock/v1/__test__/configure \
            -H 'Content-Type: application/json' \
            -d '{"seed_api_key":"mock_diag_key"}'
          echo "--- get settings with seeded key ---"
          curl -s -w '\nHTTP_STATUS:%{http_code}\n' -X GET http://localhost:8888/wp-json/r2c-mock/v1/public/wp/settings \
            -H 'x-api-key: mock_diag_key'

      - name: Run Playwright E2E tests
        run: npm run e2e

      # 失敗の切り分け用: WP側PHPのエラーログとモックの状態をCIログへ
      # そのまま出す(アーティファクトDLの往復を待たずに済む)。
      - name: Dump WP debug log and mock state
        if: always()
        run: |
          echo "::group::wp-content/debug.log"
          npx wp-env run cli bash -c "cat wp-content/debug.log 2>/dev/null || echo '(no debug.log)'"
          echo "::endgroup::"
          echo "::group::r2c_mock_state option"
          npx wp-env run cli wp option get r2c_mock_state --format=json || true
          echo "::endgroup::"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
